<section class="alert-panel">
  <div class="alert-header">
    <div>
      <p class="body-xs breakdown-title">Immediate message</p>
      <p class="body-sm alert-copy">Send a message to all users.</p>
    </div>
  </div>

  <div class="alert-controls">
    <label class="alert-field body-xs" for="alert-title-input">
      Alert title
    </label>
    <input
      id="alert-title-input"
      class="alert-input body-sm"
      type="text"
      [value]="alertTitleInput()"
      [disabled]="isSendingAlert() || !canManageObservations"
      (input)="onAlertTitleChange($any($event.target).value)"
    />
  </div>

  <div class="alert-controls">
    <label class="alert-field body-xs" for="alert-message-input">
      Message
    </label>
    <textarea
      id="alert-message-input"
      class="alert-textarea body-sm"
      rows="3"
      [value]="alertMessageInput()"
      [disabled]="isSendingAlert() || !canManageObservations"
      (input)="onAlertMessageChange($any($event.target).value)"
    ></textarea>
  </div>

  <div class="alert-controls">
    <label class="alert-field body-xs" for="alert-type-input">
      Message type
    </label>
    <select
      id="alert-type-input"
      class="alert-select body-sm"
      [value]="alertTypeInput()"
      [disabled]="isSendingAlert() || !canManageObservations"
      (change)="onAlertTypeChange($any($event.target).value)"
    >
      <option value="info">Info</option>
      <option value="warning">Warning</option>
    </select>
  </div>

  <div class="alert-controls">
    <label class="alert-field body-xs" for="alert-duration-input">
      Duration
    </label>
    <div class="alert-duration-control">
      <input
        id="alert-duration-input"
        class="alert-duration-input body-sm"
        type="number"
        min="0.25"
        step="0.25"
        [value]="alertDurationHoursInput()"
        [disabled]="isSendingAlert() || !canManageObservations"
        (input)="onAlertDurationHoursChange($any($event.target).value)"
      />
      <span class="body-xs alert-duration-unit">hours</span>
    </div>
  </div>

  <div class="alert-actions">
    <p-button
      label="Send message"
      [severity]="alertTypeInput() === 'warning' ? 'danger' : 'primary'"
      [loading]="isSendingAlert()"
      [disabled]="isSendingAlert() || !canManageObservations"
      (click)="sendImmediateAlert()"
    ></p-button>
  </div>

  @if (alertError()) {
    <p class="p-error body-sm">{{ alertError() }}</p>
  }
  @if (alertSuccess()) {
    <p class="alert-success body-sm">{{ alertSuccess() }}</p>
  }
</section>
