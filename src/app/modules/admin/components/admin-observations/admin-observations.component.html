<main class="admin-page">
  <section class="admin-layout">
    <section class="left-column">
      <app-admin-summary-card
        [stats]="stats()"
        [canManageObservations]="canManageObservations()"
      ></app-admin-summary-card>

      <app-admin-upload-chart-card
        [chart]="uploadChart()"
      ></app-admin-upload-chart-card>
    </section>

    <app-admin-observation-list
      [observations]="observationFeed()"
      [isLoading]="isLoading()"
      [errorMessage]="errorMessage()"
      [totalItems]="totalItems()"
      [pageSize]="pageSize"
      [currentPage]="currentPage()"
      [canDelete]="canDelete()"
      [deletingRecordIds]="deletingRecordIds()"
      [updatingVisibilityRecordIds]="updatingVisibilityRecordIds()"
      (refresh)="refresh()"
      (pageChange)="onPageChange($event)"
      (deleteObservation)="deleteObservation($event)"
      (toggleVisibility)="toggleVisibility($event)"
    ></app-admin-observation-list>
  </section>
</main>
