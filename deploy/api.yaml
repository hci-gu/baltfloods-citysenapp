apiVersion: apps/v1
kind: Deployment
metadata:
  name: baltfloods-api
spec:
  replicas: 1
  # Only one PocketBase process may own the SQLite database during rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: baltfloods-api
  template:
    metadata:
      labels:
        app: baltfloods-api
    spec:
      volumes:
      - name: baltfloods-api-persistent-storage
        persistentVolumeClaim:
          claimName: baltfloods-api-pv-claim
      containers:
        - name: baltfloods-api
          image: 'registry.k8s.gu.se/appademin/baltfloods-api:0.5.1'
          imagePullPolicy: Always
          # PocketBase /api/health does not check database access. Probe the
          # public record that every frontend needs before it can render.
          startupProbe:
            httpGet:
              path: /api/collections/app_settings/records/appsettings0001
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/collections/app_settings/records/appsettings0001
              port: web
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/collections/app_settings/records/appsettings0001
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          ports:
            - containerPort: 8080
              name: web
              protocol: TCP
          volumeMounts:
          - mountPath: /pb/pb_data
            name: baltfloods-api-persistent-storage
